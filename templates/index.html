<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilac Calculator - Portfólio</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="calculator" id="calculator" >
        
        <div class="top">
            <h1>Calculator</h1>
            <button class="copy-btn" onclick="copyToClipboard()">Copiar</button>
            <div class="mode-area">
                <span id="modeText">Normal</span>
                <div class="switch" onclick="toggleScientific()">
                    <div class="circle"></div>
                </div>
            </div>
        </div>

        <div class="display-container">
            <div id="history" class="history"></div>
            <input type="text" id="display" readonly>
        </div>

        <div class="all-buttons">
            
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>
                <button class="operator" onclick="appendValue('÷')">÷</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('×')">×</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('−')">−</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button onclick="deleteLast()">⌫</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>

            <div class="scientific">
                <button style="--i:0" onclick="appendValue('sin(')">sin</button>
                <button style="--i:1" onclick="appendValue('cos(')">cos</button>
                <button style="--i:2" onclick="appendValue('tan(')">tan</button>
                <button style="--i:3" onclick="appendValue('√(')">√</button>
                <button style="--i:4" onclick="appendValue('log(')">log</button>

                <button style="--i:5" onclick="appendValue('π')">π</button>
                <button style="--i:6" onclick="appendValue('e')">e</button>
                <button style="--i:7" onclick="appendValue('^')">xʸ</button>
                <button style="--i:8" onclick="appendValue('%')">%</button>
                <button style="--i:9" onclick="appendValue('!')">x!</button>
            </div>
            
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
